<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pro Concept — Concept 02 · Split Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --paper:#f4f4f2; --ink:#1a1813; --ink-2:rgba(26,24,19,.56); --ink-3:rgba(26,24,19,.34);
    --line:rgba(26,24,19,.15);
    --dark:#141414; --dark-2:#1b1b1b; --cream:rgba(245,244,240,.94); --cream-2:rgba(245,244,240,.5); --cream-line:rgba(245,244,240,.16);
    --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',system-ui,sans-serif;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--dark);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  ::selection{background:#1a1813;color:#f4f4f2}
  .wrap{max-width:1600px;height:100vh;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;background:var(--paper)}

  /* ---------- LEFT PANE ---------- */
  .left{background:var(--paper);color:var(--ink);height:100vh;overflow-y:auto;overflow-x:hidden;padding:clamp(38px,3.6vw,66px);display:flex;flex-direction:column;border-right:1px solid var(--line);scrollbar-width:none}
  .left::-webkit-scrollbar{display:none}
  .brand{display:flex;flex-direction:column;gap:9px}
  .logo{font-family:var(--serif);font-weight:500;letter-spacing:.28em;font-size:19px;color:var(--ink)}
  .tag{font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-3)}
  .mid{flex:1;display:flex;flex-direction:column;min-height:0;margin-top:clamp(30px,5vh,58px)}
  .eyebrow{font-size:10.5px;letter-spacing:.36em;text-transform:uppercase;color:var(--ink-2);margin-bottom:18px}
  .caselist{display:flex;flex-direction:column}
  .case{display:flex;align-items:center;gap:15px;padding:8px 0;background:none;border:none;text-align:left;cursor:pointer;width:100%;color:var(--ink);opacity:.42;transition:opacity .32s var(--ease),transform .32s var(--ease);font:inherit}
  .case:hover{opacity:.74;transform:translateX(5px)}
  .case:focus-visible{outline:1px solid var(--ink);outline-offset:5px;opacity:.9}
  .case.active{opacity:1;transform:none}
  .case .num{font-family:var(--sans);font-weight:400;font-size:10.5px;letter-spacing:.18em;width:24px;color:var(--ink-2);flex:none}
  .case .nm{font-family:var(--serif);font-weight:400;font-size:clamp(24px,2.25vw,32px);line-height:1.14;white-space:nowrap}
  .case.active .nm{font-style:italic}
  .case .rule{height:1px;background:var(--ink);flex:1;max-width:0;transition:max-width .5s var(--ease)}
  .case.active .rule{max-width:54px}
  .meta{margin-top:clamp(26px,4vh,46px);max-width:30ch}
  .m-line{font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-2);margin-bottom:14px}
  .m-body{font-family:var(--serif);font-weight:300;font-size:clamp(17px,1.35vw,20px);line-height:1.5;color:var(--ink)}
  .foot{margin-top:clamp(28px,5vh,50px);display:flex;flex-direction:column;gap:22px}
  .tabs{display:flex;gap:0}
  .tab{background:none;border:none;font-family:var(--sans);font-weight:400;font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-2);padding:9px 0;margin-right:30px;cursor:pointer;position:relative;transition:color .3s}
  .tab::after{content:'';position:absolute;left:0;bottom:2px;height:1px;width:0;background:var(--ink);transition:width .34s var(--ease)}
  .tab:hover{color:var(--ink)}.tab:hover::after{width:100%}
  .tab:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
  .tab.active{color:var(--ink)}.tab.active::after{width:100%}
  .cinfo{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);line-height:1.8}

  /* ---------- RIGHT PANE ---------- */
  .right{background:var(--dark);color:var(--cream);height:100vh;overflow-y:auto;overflow-x:hidden;position:relative;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:rgba(245,244,240,.2) transparent}
  .right::-webkit-scrollbar{width:7px}
  .right::-webkit-scrollbar-thumb{background:rgba(245,244,240,.16);border-radius:0}
  .rp{padding:clamp(40px,4vw,64px);transition:opacity .3s var(--ease)}
  .rp.fade-out{opacity:0}

  .rhead{margin-bottom:clamp(30px,5vh,52px)}
  .rk{font-size:10.5px;letter-spacing:.36em;text-transform:uppercase;color:var(--cream-2);margin-bottom:16px;display:flex;gap:16px;align-items:center}
  .rk .bar{height:1px;width:38px;background:var(--cream-2)}
  .rhead h2{font-family:var(--serif);font-weight:300;font-size:clamp(40px,5vw,66px);line-height:1;letter-spacing:-.01em;margin-bottom:16px}
  .rhead h2 em{font-style:italic}
  .rsub{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--cream-2);margin-bottom:20px}
  .rlead{font-family:var(--serif);font-weight:300;font-size:clamp(19px,1.7vw,24px);line-height:1.42;color:var(--cream);max-width:44ch}

  figure.shot{position:relative;margin:0 0 clamp(26px,4vh,50px);background:var(--dark-2);cursor:pointer;overflow:hidden;opacity:0;transform:translateY(28px);transition:opacity .85s var(--ease),transform .85s var(--ease)}
  figure.shot.in{opacity:1;transform:none}
  figure.shot .frame{position:relative;overflow:hidden;background:var(--dark-2)}
  figure.shot img{display:block;width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease),filter .6s;filter:saturate(.92)}
  figure.shot:hover img{transform:scale(1.035);filter:saturate(1)}
  figure.shot .plus{position:absolute;top:16px;right:16px;width:34px;height:34px;border:1px solid rgba(245,244,240,.4);border-radius:50%;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.8);transition:opacity .4s,transform .4s;background:rgba(20,20,20,.28);backdrop-filter:blur(2px)}
  figure.shot:hover .plus{opacity:1;transform:scale(1)}
  .plus svg{width:13px;height:13px;stroke:#f5f4f0;stroke-width:1.5;fill:none}
  .cap{display:flex;justify-content:space-between;align-items:baseline;margin-top:13px}
  .cap .ctitle{font-family:var(--serif);font-style:italic;font-weight:300;font-size:16px;color:var(--cream)}
  .cap .cnum{font-size:10px;letter-spacing:.24em;color:var(--cream-2)}

  /* ---------- ABOUT ---------- */
  .about .rlead{margin-bottom:clamp(26px,4vh,44px)}
  .about p{font-family:var(--serif);font-weight:300;font-size:clamp(16px,1.25vw,19px);line-height:1.62;color:var(--cream);max-width:52ch;margin-bottom:20px}
  .services{list-style:none;display:flex;flex-wrap:wrap;gap:10px 12px;margin:clamp(26px,4vh,40px) 0}
  .services li{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--cream);border:1px solid var(--cream-line);padding:9px 16px}
  .about .abimg{margin-top:clamp(26px,4vh,42px);overflow:hidden;background:var(--dark-2);aspect-ratio:1280/704}
  .about .abimg img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.1s var(--ease)}
  .about .abimg:hover img{transform:scale(1.03)}

  /* ---------- CONTACT ---------- */
  .contact form{max-width:46ch;margin-top:clamp(24px,4vh,38px)}
  .field{border-bottom:1px solid var(--cream-line);padding:16px 0;transition:border-color .3s}
  .field:focus-within{border-color:var(--cream)}
  .field label{display:block;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--cream-2);margin-bottom:8px}
  .field input,.field textarea{width:100%;background:none;border:none;color:var(--cream);font-family:var(--serif);font-weight:300;font-size:19px;outline:none;resize:none}
  .field input::placeholder,.field textarea::placeholder{color:rgba(245,244,240,.28)}
  .send{margin-top:30px;background:none;border:1px solid var(--cream);color:var(--cream);font-family:var(--sans);font-weight:400;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;padding:16px 34px;cursor:pointer;transition:background .35s var(--ease),color .35s var(--ease)}
  .send:hover{background:var(--cream);color:var(--dark)}
  .send:focus-visible{outline:1px solid var(--cream);outline-offset:4px}
  .cdetails{margin-top:clamp(30px,5vh,50px);display:flex;flex-direction:column;gap:6px}
  .cdetails .cl{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--cream-2);line-height:1.9}
  .confirm{max-width:44ch}
  .confirm .ok{width:40px;height:40px;border:1px solid var(--cream);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:22px}
  .confirm .ok svg{width:16px;height:16px;stroke:#f5f4f0;stroke-width:1.5;fill:none}
  .confirm p{font-family:var(--serif);font-weight:300;font-size:clamp(20px,1.9vw,26px);line-height:1.42;color:var(--cream);margin-bottom:26px}
  .again{background:none;border:none;color:var(--cream-2);font-family:var(--sans);font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;cursor:pointer;padding:6px 0;position:relative;transition:color .3s}
  .again::after{content:'';position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--cream-2);transition:background .3s}
  .again:hover{color:var(--cream)}.again:hover::after{background:var(--cream)}

  /* ---------- LIGHTBOX ---------- */
  .lb{position:fixed;inset:0;z-index:60;background:rgba(11,11,11,.95);display:flex;align-items:center;justify-content:center;padding:clamp(30px,6vh,72px);opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
  .lb.open{opacity:1;pointer-events:auto}
  .lb-fig{max-width:min(900px,90vw);max-height:88vh;display:flex;flex-direction:column;align-items:center;transform:scale(.97);transition:transform .4s var(--ease)}
  .lb.open .lb-fig{transform:scale(1)}
  .lb-fig img{max-width:100%;max-height:80vh;object-fit:contain;background:var(--dark-2);display:block}
  .lb-fig figcaption{margin-top:16px;font-family:var(--serif);font-style:italic;font-weight:300;font-size:16px;letter-spacing:.02em;color:var(--cream-2)}
  .lb-close{position:absolute;top:26px;right:30px;width:42px;height:42px;border:1px solid rgba(245,244,240,.35);background:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .3s,border-color .3s}
  .lb-close:hover{background:rgba(245,244,240,.12);border-color:var(--cream)}
  .lb-close svg{width:15px;height:15px;stroke:#f5f4f0;stroke-width:1.5;fill:none}

  /* ---------- HUB PILL ---------- */
  .pill{position:fixed;right:18px;bottom:18px;z-index:50;display:inline-flex;align-items:center;gap:9px;background:rgba(244,244,242,.9);color:#1a1813;border:1px solid rgba(26,24,19,.18);border-radius:999px;padding:9px 15px 9px 13px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;backdrop-filter:blur(6px);transition:background .3s,transform .3s;box-shadow:0 6px 22px -10px rgba(0,0,0,.5)}
  .pill:hover{background:#fff;transform:translateY(-2px)}
  .pill svg{width:13px;height:13px;stroke:#1a1813;stroke-width:1.5;fill:none}

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:860px){
    body{overflow:auto}
    .wrap{max-width:100%;height:auto;display:block}
    .left{height:auto;overflow:visible;border-right:none;border-bottom:1px solid var(--line);padding:34px 26px 40px}
    .mid{margin-top:34px}
    .case .nm{white-space:normal}
    .right{height:auto;overflow:visible}
    .rp{padding:36px 26px 60px}
  }
</style>
</head>
<body>
<div class="wrap">
  <aside class="left">
    <div class="brand">
      <div class="logo">PRO CONCEPT</div>
      <div class="tag">Production Studio</div>
    </div>
    <div class="mid">
      <div class="eyebrow">Selected Work</div>
      <nav class="caselist" id="caselist" aria-label="Case studies"></nav>
      <div class="meta" id="leftMeta"></div>
    </div>
    <div class="foot">
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="work" type="button">Work</button>
        <button class="tab" data-tab="about" type="button">About</button>
        <button class="tab" data-tab="contact" type="button">Contact</button>
      </div>
      <div class="cinfo">Barcelona &middot; Venice<br>hello@proconcept.studio</div>
    </div>
  </aside>

  <main class="right" id="right">
    <div class="rp" id="rpInner"></div>
  </main>
</div>

<div class="lb" id="lb" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Photo preview">
  <button class="lb-close" id="lbClose" type="button" aria-label="Close preview">
    <svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg>
  </button>
  <figure class="lb-fig">
    <img id="lbImg" alt="">
    <figcaption id="lbCap"></figcaption>
  </figure>
</div>

<a class="pill" href="./index.html" aria-label="Все макеты">
  <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
  Все макеты
</a>

<script>
(function(){
  "use strict";
  var MEDIA = 'https://static.wixstatic.com/media/';
  function url(id,w,h){
    return MEDIA + id + '/v1/fill/w_' + Math.min(Math.round(w*1.5),1480) + ',h_' + Math.round(h*1.5) + ',al_c,q_85,enc_avif,quality_auto/' + id;
  }

  var CASES = [
    {
      name:'RedMex', loc:'Venice, Italy', year:'2025', cat:'Brand Campaign',
      title:'Red<em>Mex</em>',
      body:'A cinematic wander through the canals — tailoring, texture and the quiet drama of the lagoon, staged for the RedMex house.',
      shots:[
        {id:'516d35_232c102cf44d42f08b574382369c8b0f~mv2.jpg',w:560,h:859,cap:'Canal Light'},
        {id:'516d35_47cafac7583f4a5c826dbfceb534907b~mv2.jpg',w:1153,h:618,cap:'The Lagoon'},
        {id:'516d35_91d117752575491b9fb59e8465e936f6~mv2.jpg',w:574,h:859,cap:'Palazzo'},
        {id:'516d35_e57085466d9b4f77940d9cf47d8e7417~mv2.jpg',w:560,h:811,cap:'Silk & Stone'},
        {id:'516d35_767494d9ebc44300a73d00b6b4016430~mv2.jpg',w:574,h:811,cap:'Dusk'}
      ]
    },
    {
      name:'Numéro', loc:'Editorial', year:'Numéro Magazine', cat:'Velvet Dusk',
      title:'Numéro',
      body:'Velvet Dusk is a bold ode to avant-garde beauty and the haunting poetry of high style, shot for the pages of Numéro.',
      shots:[
        {id:'516d35_21db5e038fe04058a5850ded7e0f744e~mv2.jpg',w:674,h:951,cap:'Velvet'},
        {id:'516d35_f2baec6bd9e84aa4801eb24746c7a74e~mv2.jpg',w:1364,h:476,cap:'Dusk Fall'},
        {id:'516d35_0b8421cfae52484da1a8691631d280cc~mv2.jpeg',w:674,h:951,cap:'Avant-Garde'},
        {id:'516d35_d77ab9ce6c0041f4984ef42c642a4918~mv2.jpg',w:1386,h:662,cap:'High Style'},
        {id:'516d35_b0381981031046109a8476d097557a2c~mv2.jpg',w:723,h:472,cap:'The Editorial'}
      ]
    },
    {
      name:'Suyty', loc:'Ibiza, Spain', year:'SS25', cat:'Edition Lookbook',
      title:'Suyty',
      body:'One of the projects shot in Ibiza this spring for Suyty EDITION SS25 — sun-bleached tailoring against salt and stone.',
      shots:[
        {id:'516d35_c1a4da44b8024f889f41c5732637b068~mv2.jpg',w:440,h:612,cap:'Edition 01'},
        {id:'516d35_721b1d145df74201a5374a490864727b~mv2.jpg',w:1385,h:684,cap:'Ibiza Salt'},
        {id:'516d35_1b824113bda84e04869bfc1d67fe81fc~mv2.jpg',w:440,h:612,cap:'SS25'},
        {id:'516d35_6c3733536816454eb83583eebb4be9b2~mv2.jpg',w:1385,h:721,cap:'Sun Bleached'},
        {id:'516d35_5b491eb6a6f24df5997a3b9fb0303d69~mv2.jpg',w:430,h:612,cap:'The Coast'}
      ]
    },
    {
      name:'Alavelarium', loc:'Como Lake, Italy', year:'SS25', cat:'Campaign',
      title:'Alave<em>larium</em>',
      body:'One of the projects shot at Como Lake this spring for Alavelarium SS25 — still water, soft light and slow elegance.',
      shots:[
        {id:'516d35_8dbddaebe39145d5a03752d17e313394~mv2.jpg',w:476,h:579,cap:'Como Morning'},
        {id:'516d35_c6cf574fd37e43b4aa43dae14b457e40~mv2.jpg',w:1375,h:744,cap:'The Lake'},
        {id:'516d35_253d3d4479974109a5b2700689d5bf2c~mv2.jpg',w:385,h:570,cap:'Villa'},
        {id:'516d35_97ef482fcbed42429610fea0f0ec572e~mv2.jpg',w:1339,h:806,cap:'Still Water'},
        {id:'516d35_2e11f50a7ddc42a6b6884bc45cc59aca~mv2.jpg',w:440,h:579,cap:'SS25'}
      ]
    },
    {
      name:'Fashion Weeks', loc:'Milan · Paris', year:'2025', cat:'Runway & Backstage',
      title:'Fashion <em>Weeks</em>',
      body:'Backstage passes and front-row seats across the season’s defining fashion weeks in Milan and Paris.',
      shots:[
        {id:'516d35_d1252447d32c4f9a9ed0b96544da7f3d~mv2.jpg',w:400,h:600,cap:'Front Row'},
        {id:'516d35_70673b4af128409cba78795ce6ecb15d~mv2.jpg',w:947,h:513,cap:'Backstage'},
        {id:'516d35_b164bbb093ca4d618bfe8f44334c8b14~mv2.jpg',w:400,h:600,cap:'The Runway'},
        {id:'516d35_11642e98a0734043946543a2c9267b37~mv2.jpg',w:870,h:480,cap:'Season'},
        {id:'516d35_44478ab47cc6434793eb01b581c228ed~mv2.jpg',w:400,h:600,cap:'Milan · Paris'}
      ]
    }
  ];

  var HERO = {id:'516d35_20b16c5142b84d78af7c1ed07abe5142~mv2.jpg',w:1280,h:704};

  var state = { mode:'work', idx:0 };
  var caselist = document.getElementById('caselist');
  var leftMeta = document.getElementById('leftMeta');
  var rightPane = document.getElementById('right');
  var rpInner = document.getElementById('rpInner');
  var tabs = document.getElementById('tabs');
  var lb = document.getElementById('lb');
  var lbImg = document.getElementById('lbImg');
  var lbCap = document.getElementById('lbCap');
  var lbClose = document.getElementById('lbClose');

  var pad2 = function(n){ return (n<10? '0':'') + n; };
  var esc = function(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; };

  /* ---- build case menu ---- */
  if (caselist){
    CASES.forEach(function(c, i){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'case' + (i===0? ' active':'');
      b.setAttribute('data-i', i);
      b.innerHTML = '<span class="num">'+pad2(i+1)+'</span><span class="nm">'+esc(c.name)+'</span><span class="rule"></span>';
      b.addEventListener('click', function(){ selectCase(i); });
      caselist.appendChild(b);
    });
  }

  function markCase(){
    if(!caselist) return;
    var nodes = caselist.querySelectorAll('.case');
    for(var i=0;i<nodes.length;i++){ nodes[i].classList.toggle('active', i===state.idx); }
  }
  function markTab(){
    if(!tabs) return;
    var t = tabs.querySelectorAll('.tab');
    for(var i=0;i<t.length;i++){ t[i].classList.toggle('active', t[i].getAttribute('data-tab')===state.mode); }
  }

  /* ---- left meta ---- */
  function renderLeftMeta(){
    if(!leftMeta) return;
    var c = CASES[state.idx];
    if(state.mode==='work'){
      leftMeta.innerHTML = '<div class="m-line">'+esc(c.loc)+' &nbsp;·&nbsp; '+esc(c.year)+'</div>'+
        '<p class="m-body">'+esc(c.body)+'</p>';
    } else if(state.mode==='about'){
      leftMeta.innerHTML = '<div class="m-line">The Studio</div>'+
        '<p class="m-body">Full-service photo &amp; video production for brands and magazines — from first concept to final campaign.</p>';
    } else {
      leftMeta.innerHTML = '<div class="m-line">Get in touch</div>'+
        '<p class="m-body">Tell us about the project. We reply to every enquiry within 48 hours.</p>';
    }
  }

  /* ---- right pane builders ---- */
  function shotHTML(s, i, total){
    var ar = s.w + '/' + s.h;
    return '<figure class="shot" data-src="'+url(s.id, 1000, Math.round(1000*s.h/s.w))+'" data-cap="'+esc(s.cap)+'">'+
      '<div class="frame" style="aspect-ratio:'+ar+';background:var(--dark-2)">'+
        '<img loading="lazy" alt="'+esc(s.cap)+'" src="'+url(s.id, s.w, s.h)+'">'+
        '<span class="plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>'+
      '</div>'+
      '<figcaption class="cap"><span class="ctitle">'+esc(s.cap)+'</span><span class="cnum">'+pad2(i+1)+' / '+pad2(total)+'</span></figcaption>'+
    '</figure>';
  }

  function buildWork(){
    var c = CASES[state.idx];
    var html = '<header class="rhead">'+
      '<div class="rk"><span class="bar"></span>'+esc(c.cat)+'</div>'+
      '<h2>'+c.title+'</h2>'+
      '<div class="rsub">'+esc(c.loc)+' &nbsp;/&nbsp; '+esc(c.year)+'</div>'+
      '<p class="rlead">'+esc(c.body)+'</p>'+
    '</header>';
    for(var i=0;i<c.shots.length;i++){ html += shotHTML(c.shots[i], i, c.shots.length); }
    rpInner.className = 'rp';
    rpInner.innerHTML = html;
    wireShots();
  }

  function buildAbout(){
    rpInner.className = 'rp about';
    rpInner.innerHTML = '<header class="rhead">'+
      '<div class="rk"><span class="bar"></span>About the Studio</div>'+
      '<h2>Create a unique <em>brand identity</em></h2>'+
      '<p class="rlead">…that instantly connects with your target audience.</p>'+
    '</header>'+
    '<p>Pro Concept is a photo and video production studio working with fashion houses, brands and magazines. Our latest projects &amp; fashion editorials move between location shoots and controlled studio light, always in service of a single, considered idea.</p>'+
    '<p>From RedMex in Venice to Velvet Dusk for Numéro, we build worlds — art direction, styling, set and image — so that each campaign carries its own atmosphere and stays with the viewer.</p>'+
    '<ul class="services">'+
      '<li>Editorial</li><li>Campaign</li><li>Lookbook</li><li>Video</li><li>Art Direction</li>'+
    '</ul>'+
    '<div class="abimg"><img loading="lazy" alt="Pro Concept" src="'+url(HERO.id, HERO.w, HERO.h)+'"></div>';
  }

  function buildContact(){
    rpInner.className = 'rp contact';
    rpInner.innerHTML = '<header class="rhead">'+
      '<div class="rk"><span class="bar"></span>Contact</div>'+
      '<h2>Let’s create <em>something.</em></h2>'+
      '<p class="rlead">Share a few words about your project and we’ll take it from there.</p>'+
    '</header>'+
    '<form id="cform" novalidate>'+
      '<div class="field"><label for="fn">Name</label><input id="fn" type="text" required placeholder="Your name" autocomplete="off"></div>'+
      '<div class="field"><label for="fe">Email</label><input id="fe" type="email" required placeholder="you@studio.com" autocomplete="off"></div>'+
      '<div class="field"><label for="fm">Project</label><textarea id="fm" rows="3" required placeholder="Tell us what you have in mind"></textarea></div>'+
      '<button class="send" type="submit">Send enquiry</button>'+
    '</form>'+
    '<div class="cdetails">'+
      '<span class="cl">Studio — Barcelona &middot; Venice</span>'+
      '<span class="cl">hello@proconcept.studio</span>'+
      '<span class="cl">Enquiries answered within 48 hours</span>'+
    '</div>';
    wireForm();
  }

  function buildCurrent(){
    if(state.mode==='about'){ buildAbout(); }
    else if(state.mode==='contact'){ buildContact(); }
    else { buildWork(); }
    renderLeftMeta();
    if(state.mode==='work'){ revealShots(); }
  }

  /* ---- transition ---- */
  var transitioning = false;
  function transitionTo(fn){
    if(!rpInner) return;
    if(transitioning){ return; }
    transitioning = true;
    rpInner.classList.add('fade-out');
    window.setTimeout(function(){
      fn();
      rightPane.scrollTop = 0;
      rpInner.classList.remove('fade-out');
      transitioning = false;
    }, 300);
  }

  function selectCase(i){
    var changed = (i!==state.idx) || (state.mode!=='work');
    state.idx = i;
    state.mode = 'work';
    markCase(); markTab();
    if(changed){ transitionTo(buildCurrent); } else { buildCurrent(); }
  }

  function setMode(m){
    if(m===state.mode && m!=='work'){ return; }
    state.mode = m;
    markTab();
    transitionTo(buildCurrent);
  }

  if(tabs){
    tabs.addEventListener('click', function(e){
      var t = e.target.closest('.tab');
      if(!t) return;
      setMode(t.getAttribute('data-tab'));
    });
  }

  /* ---- scroll reveal ---- */
  var io = null;
  function revealShots(){
    var shots = rpInner ? rpInner.querySelectorAll('.shot') : [];
    if(!('IntersectionObserver' in window)){
      for(var k=0;k<shots.length;k++){ shots[k].classList.add('in'); }
      return;
    }
    if(io){ io.disconnect(); }
    var narrow = window.matchMedia('(max-width:860px)').matches;
    io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }
      });
    }, { root: narrow ? null : rightPane, threshold:0.12, rootMargin:'0px 0px -6% 0px' });
    for(var j=0;j<shots.length;j++){ io.observe(shots[j]); }
  }

  /* ---- lightbox ---- */
  var scrollLocked = false;
  function lockScroll(){
    scrollLocked = true;
    if(rightPane){ rightPane.style.overflowY = 'hidden'; }
    document.body.style.overflow = 'hidden';
  }
  function unlockScroll(){
    scrollLocked = false;
    if(rightPane){ rightPane.style.overflowY = ''; }
    document.body.style.overflow = '';
  }
  function openLB(src, cap){
    if(!lb) return;
    lbImg.src = src; lbImg.alt = cap || '';
    lbCap.textContent = cap || '';
    lb.classList.add('open');
    lb.setAttribute('aria-hidden','false');
    lockScroll();
  }
  function closeLB(){
    if(!lb) return;
    lb.classList.remove('open');
    lb.setAttribute('aria-hidden','true');
    unlockScroll();
    window.setTimeout(function(){ if(!lb.classList.contains('open')) lbImg.removeAttribute('src'); }, 380);
  }
  function wireShots(){
    if(!rpInner) return;
    var shots = rpInner.querySelectorAll('.shot');
    for(var i=0;i<shots.length;i++){
      (function(fig){
        fig.addEventListener('click', function(){
          openLB(fig.getAttribute('data-src'), fig.getAttribute('data-cap'));
        });
      })(shots[i]);
    }
  }
  if(lbClose){ lbClose.addEventListener('click', closeLB); }
  if(lb){ lb.addEventListener('click', function(e){ if(e.target===lb || e.target.classList.contains('lb-fig')){ closeLB(); } }); }
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && lb && lb.classList.contains('open')){ closeLB(); }
  });

  /* ---- contact form ---- */
  function wireForm(){
    var form = document.getElementById('cform');
    if(!form) return;
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var n = document.getElementById('fn');
      var em = document.getElementById('fe');
      if(n && em && (!n.value.trim() || !em.value.trim())){
        var empty = !n.value.trim() ? n : em;
        empty.focus();
        empty.parentNode.style.borderColor = 'rgba(245,244,240,.55)';
        return;
      }
      var name = n && n.value.trim() ? n.value.trim().split(' ')[0] : 'there';
      form.parentNode.querySelector('.cdetails');
      var wrap = form.parentNode;
      var confirm = document.createElement('div');
      confirm.className = 'confirm';
      confirm.innerHTML = '<div class="ok"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>'+
        '<p>Thank you, '+esc(name)+'. Your message is on its way — we’ll be in touch within 48 hours.</p>'+
        '<button class="again" type="button">Send another</button>';
      var details = wrap.querySelector('.cdetails');
      form.replaceWith(confirm);
      if(details){ details.style.marginTop = '40px'; }
      var again = confirm.querySelector('.again');
      if(again){ again.addEventListener('click', function(){ buildContact(); }); }
    });
  }

  /* ---- init ---- */
  buildCurrent();
  markCase(); markTab();
})();
</script>
</body>
</html>
